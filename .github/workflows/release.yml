name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build for (e.g., 1.3.4)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AKKA_REPO_TOKEN: ${{ secrets.AKKA_REPO_TOKEN }}
    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          fetch-depth: 0
          # Required so sbt-dynver's `git describe` sees the release tag and
          # derives the real version (e.g. 2.0.0) rather than the 0.0.0+<n>
          # "no tag found" fallback.
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set Up SBT
        uses: sbt/setup-sbt@v1

      - name: Coursier Caching
        uses: coursier/cache-action@v8

      - name: Build, Test, and Publish
        # sbt 2 parses CLI args as one command line; use ;-separated commands.
        run: sbt -v "; clean; test; publish"

      - name: Collect Artifacts
        run: |
          mkdir -p staging
          # sbt 2 target layout: target/out/jvm/scala-<v>/sbt-ossuminc/sbt-ossuminc_sbt2_3-*.jar
          cp target/out/jvm/scala-*/sbt-ossuminc/sbt-ossuminc_sbt2_3-*.jar staging/
          ls -la staging/

      - name: Upload Artifacts to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          gh release upload "$TAG" staging/*.jar --clobber

      - name: Cleanup Before Caching
        shell: bash
        run: |
          rm -rf "$HOME/.ivy2/local" || true
          find $HOME/.cache/coursier/v1 -name "ivydata-*.properties" -delete || true
          find $HOME/.ivy2/cache -name "ivydata-*.properties" -delete || true
          find $HOME/.sbt -name "*.lock" -delete || true

  # Announce minor+ releases on ossum.ai/blog and the newsletter. Patch
  # releases (x.y.Z with Z>0) are intentionally skipped to avoid subscriber
  # noise from routine build-plugin fixes. This only fires after `release`
  # (the publish job) succeeds. Requires the BLOG_DISPATCH secret: a PAT that
  # can POST repository_dispatch to ossuminc/ossum.ai (same secret riddl uses).
  # The ossum.ai side must handle event_type `sbt-ossuminc-release`.
  notify-blog:
    needs: [release]
    if: ${{ endsWith(github.event.release.tag_name || github.event.inputs.tag, '.0') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - name: Fetch release body
        env:
          GH_TOKEN: ${{ secrets.BLOG_DISPATCH }}
        run: |
          BODY=$(gh api repos/ossuminc/sbt-ossuminc/releases/tags/${TAG} --jq '.body' 2>/dev/null || echo "")
          if [ -z "$BODY" ]; then
            echo "::warning::Could not fetch release body for ${TAG}"
          fi
          # Write to a file to avoid shell quoting issues.
          echo "$BODY" > /tmp/release-body.txt

      - name: Dispatch blog post creation
        env:
          GH_TOKEN: ${{ secrets.BLOG_DISPATCH }}
        run: |
          BODY=$(cat /tmp/release-body.txt)
          gh api repos/ossuminc/ossum.ai/dispatches \
            --method POST \
            --input - <<PAYLOAD
          {
            "event_type": "sbt-ossuminc-release",
            "client_payload": {
              "product": "sbt-ossuminc",
              "version": "${TAG}",
              "release_url": "https://github.com/ossuminc/sbt-ossuminc/releases/tag/${TAG}",
              "body": $(echo "$BODY" | jq -Rs .)
            }
          }
          PAYLOAD
